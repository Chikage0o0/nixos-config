providers:
  webSearchTimeoutSeconds: 60
  openaiWebsockets: "on"
modelRoles:
  designer: anthropic/claude-opus-5-5:high
  smol: openai-codex/gpt-6-luna:high
  slow: anthropic/claude-opus-5-5:high
  vision: openai-codex/gpt-6-luna:high
  tiny: openai-codex/gpt-6-luna:low
  default: openai-codex/gpt-6.1-sol:high
  web: openai-codex/gpt-6-luna:high
  image: openai-codex/gpt-image-1
  task: openai-codex/gpt-6.1-sol:low
task:
  agentModelOverrides:
    librarian: "@smol"
    scout: "@smol"
    designer: "@designer"
    reviewer: "@slow"
    task: "@task"
    sonic: "@smol"
symbolPreset: nerd
theme:
  dark: pearl
  light: light
setupVersion: 2
cycleOrder:
  - slow
  - default
  - smol
  - task
disabledProviders:
  - claude
  - codex
  - gemini
  - opencode
  - github
  - cursor
colorBlindMode: false
statusLine:
  separator: powerline-thin
  sessionAccent: true
  compactThinkingLevel: false
  transparent: true
  showHookStatus: true
terminal:
  showProgress: true
hideThinkingBlock: false
doubleEscapeAction: rewind
plan:
  enabled: true
  defaultOnStartup: false
commands:
  enableClaudeUser: false
  enableClaudeProject: false
  enableOpencodeUser: false
  enableOpencodeProject: false
dev:
  autoqa: false
web_search:
  enabled: true
astGrep:
  enabled: true
compaction:
  thresholdTokens: 250000
  methodOrder:
    - remote
    - soft
tui:
  imeSafeCursor: true
  titleState: false
startup:
  checkUpdate: false
python:
  kernelMode: session
eval:
  js: true
composer:
  shape: box
generate_image:
  enabled: false
edit:
  mode: replace
  fuzzyMatch: false
  modelVariants:
    gpt: apply_patch
codexResets:
  autoRedeem: "yes"